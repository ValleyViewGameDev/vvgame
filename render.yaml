services:
  - type: web
    name: vvgame-client
    env: static
    rootDir: game-client
    buildCommand: npm run build
    staticPublishPath: build
    # Fresh code after a deploy (the "The Game Has Updated" prompt reloads into it): the page
    # itself must revalidate every load; the hashed JS/CSS under /static never change, so they
    # cache forever, and so do the hashed sprite sheets. Only applies if this service is managed by this Blueprint; otherwise set
    # the same rules in the Render dashboard (vvgame-client > Headers).
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # the sprite sheets are named by content hash (build-atlas.js, BL-24): a changed sheet is a new
      # file, so they cache forever too; the manifest atlas/world.json is outside this path and revalidates
      - path: /assets/atlas/sheets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
