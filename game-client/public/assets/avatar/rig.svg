<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!--
  The avatar rig (docs/avatar-plan.md section 2.3). Every part is drawn in THIS 256 x 256 frame; the
  numbers come from the Citizen busts (a 200 px bust scaled by 1.28, eye line moved to y 122):

    head          ellipse centre (128, 128), ~128 wide, top y ~44, chin y ~186 (on the collar)
    eye line      y = 122      eyes centred at x = 96 and x = 160 (gap 64)
    mouth         y ~ 160
    neck          x 108 .. 148, y 186 .. 215, UNDER the top (the collar draws over it)
    shoulder line y = 190      bust spans x 24 .. 232, cut off by the frame bottom at y = 256
    hair          tops out at y 12 (Waves, hair-02, is the limit) and never ends above the
                  head's own crown at y ~44: every hairFront covers the band y 12 .. 44
    hand slot     centre (204, 214), ~ 60 px wide: the weapon hand draws here, in front of
                  the right shoulder (viewer's right), never flipped

  Z order, back to front: hairBack, skin, top, eyes, facialHair, hairFront, hat, hand.
  Tintable parts (skin, hair, facialHair, the iris of eyes) are drawn WHITE with BLACK
  line work and GREY shading; the palette colour multiplies in at render time.
  A source bust is fitted by tools/avatar/assemble.js (fit.scale 1.28, fit.dy per source).
-->
  <rect x="0.5" y="0.5" width="255" height="255" fill="none" stroke="#9aa" stroke-dasharray="4 4"/>
  <ellipse cx="128" cy="128" rx="64" ry="70" fill="none" stroke="#c66" stroke-width="1"/>
  <line x1="40" y1="12" x2="216" y2="12" stroke="#a6a" stroke-dasharray="6 3"/>
  <line x1="64" y1="122" x2="192" y2="122" stroke="#c66" stroke-dasharray="2 3"/>
  <circle cx="96" cy="122" r="3" fill="#c66"/><circle cx="160" cy="122" r="3" fill="#c66"/>
  <line x1="104" y1="160" x2="152" y2="160" stroke="#c66" stroke-dasharray="2 3"/>
  <rect x="108" y="186" width="40" height="28" fill="none" stroke="#6a6" stroke-width="1"/>
  <path d="M24 256 C 24 206, 70 190, 128 190 C 186 190, 232 206, 232 256" fill="none" stroke="#66c" stroke-width="1"/>
  <line x1="24" y1="190" x2="232" y2="190" stroke="#66c" stroke-dasharray="2 3"/>
  <circle cx="204" cy="214" r="30" fill="none" stroke="#c93" stroke-dasharray="3 3"/>
  <text x="128" y="246" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#888">avatar rig 256 - eyes y122 x96/160 - chin y186 - hand (204,214)</text>
</svg>
