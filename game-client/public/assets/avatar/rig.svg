<?xml version="1.0" encoding="utf-8"?>
<!--
  The avatar rig (docs/avatar-plan.md §2.3). Every part is drawn in THIS 256 x 256 frame,
  on these guides, so the compositor can stack the layers with no per-part offsets:

    head centre   (128, 104)   head width ~ 120 (x 68 .. 188), chin at y ~ 164
    eye line      y = 100      eyes centred at x = 104 and x = 152
    neck          x 108 .. 148, y 160 .. 186
    shoulder line y = 190      bust spans x 24 .. 232, cut off by the frame bottom at y = 256
    hand slot     centre (204, 214), ~ 60 px wide: the weapon hand draws here, in front of
                  the right shoulder (viewer's right), never flipped

  Z order, back to front: hairBack, top, skin, eyes, facialHair, hairFront, hat, hand.
  Tintable parts (skin, hair, facialHair, the iris of eyes) are drawn WHITE with BLACK
  line work and GREY shading; the palette colour multiplies in at render time.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect x="0.5" y="0.5" width="255" height="255" fill="none" stroke="#9aa" stroke-dasharray="4 4"/>
  <!-- head -->
  <ellipse cx="128" cy="104" rx="60" ry="62" fill="none" stroke="#c66" stroke-width="1"/>
  <line x1="68" y1="100" x2="188" y2="100" stroke="#c66" stroke-dasharray="2 3"/>
  <circle cx="104" cy="100" r="3" fill="#c66"/><circle cx="152" cy="100" r="3" fill="#c66"/>
  <!-- neck -->
  <rect x="108" y="160" width="40" height="28" fill="none" stroke="#6a6" stroke-width="1"/>
  <!-- shoulders / bust -->
  <path d="M24 256 C 24 206, 70 190, 128 190 C 186 190, 232 206, 232 256" fill="none" stroke="#66c" stroke-width="1"/>
  <line x1="24" y1="190" x2="232" y2="190" stroke="#66c" stroke-dasharray="2 3"/>
  <!-- hand slot -->
  <circle cx="204" cy="214" r="30" fill="none" stroke="#c93" stroke-dasharray="3 3"/>
  <text x="128" y="246" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#888">avatar rig 256 · head (128,104) · shoulders y190 · hand (204,214)</text>
</svg>
